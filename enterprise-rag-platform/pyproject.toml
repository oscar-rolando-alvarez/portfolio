[project]
name = "ragplatform"
version = "0.1.0"
description = "Multi-tenant enterprise knowledge assistant: permission-aware hybrid retrieval, grounded answers with citations, evals and cost accounting."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Oscar Alvarez", email = "oralvarez@gmail.com" }]
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "pypdf>=6.21.0",
    "beautifulsoup4>=4.15.0",
    "python-multipart>=0.0.32",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
ragplatform = "ragplatform.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragplatform"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "PL", "TRY", "PERF"]
ignore = [
    "PLR0913", # wide constructors are expected for DI wiring
    "PLR2004", # magic values in thresholds are documented in config
    "TRY003",
    "S608",    # SQL is built from constant fragments; values are always bound parameters
    "E501",    # line length is enforced by the formatter; long literals (SQL, regex) are fine
    "PLR0917", # keyword-heavy DI constructors
    "PLC0415", # deliberate lazy imports keep optional adapters off the import path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"src/ragplatform/adapters/memory/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["ragplatform"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires PostgreSQL with pgvector (RAG_DATABASE_URL)"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["ragplatform"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false
