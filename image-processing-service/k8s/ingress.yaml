apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-processing
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: images.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: image-processing
                port:
                  name: http
