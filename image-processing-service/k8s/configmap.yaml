apiVersion: v1
kind: ConfigMap
metadata:
  name: image-processing-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  MAX_UPLOAD_MB: "10"
  MAX_PIXELS: "40000000"
  STORAGE_DIR: "/app/data/images"
  VISION_PROVIDER: "openai"
  LLM_VISION_MODEL: "gpt-4o-mini"
  VISION_MAX_SIDE: "1024"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
  # LLM_BASE_URL and LLM_API_KEY come from the `image-processing-secrets` Secret:
  #   kubectl -n image-processing create secret generic image-processing-secrets \
  #     --from-literal=LLM_BASE_URL=https://your-openai-compatible-endpoint/v1 \
  #     --from-literal=LLM_API_KEY=...
