apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-processing

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: image-processing-service
    includeSelectors: true

images:
  - name: image-processing-service
    newName: ghcr.io/oscar-rolando-alvarez/image-processing-service
    newTag: "2.0.0"
