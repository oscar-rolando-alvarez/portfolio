# Usage: docker compose up --build
# For a real vision model, set VISION_PROVIDER=openai plus LLM_* variables in .env
services:
  api:
    build:
      context: .
      args:
        WITH_OCR: "true"
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LOG_JSON: "true"
    volumes:
      - images:/app/data

volumes:
  images:
