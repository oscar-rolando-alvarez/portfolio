services:
  dashboard:
    build: .
    image: analytics-dashboard:local
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Optional OpenAI-compatible endpoint for natural-language insights.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    restart: unless-stopped
