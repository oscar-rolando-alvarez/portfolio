# Runs the marketplace UI container. NEXT_PUBLIC_* values are inlined by
# Next.js at build time, so they are passed as build args (override via a .env
# file next to this compose file or your shell environment).
services:
  app:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_CLUSTER: ${NEXT_PUBLIC_CLUSTER:-devnet}
        NEXT_PUBLIC_MARKETPLACE_PROGRAM_ID: ${NEXT_PUBLIC_MARKETPLACE_PROGRAM_ID:-BKvFQqBhXJNpKjmAzwvsbuHGKG54EPcdcV7YmRfxw1Te}
        NEXT_PUBLIC_AUCTION_PROGRAM_ID: ${NEXT_PUBLIC_AUCTION_PROGRAM_ID:-5YeC15ieZAhKmeDeVHR1xDzC6patSL68yQTtgqEio7Sh}
    image: nft-marketplace-app:local
    ports:
      - "3000:3000"
    restart: unless-stopped
