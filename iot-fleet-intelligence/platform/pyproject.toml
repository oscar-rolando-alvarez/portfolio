[project]
name = "fleetintel"
version = "0.1.0"
description = "Event-driven IoT connectivity intelligence: streaming anomaly detection, resilient enrichment, LLM diagnosis with RAG, and a first-class AWS + LLM cost estimator."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Oscar Alvarez", email = "oralvarez@gmail.com" }]
# Runtime dependencies = what ships in the Lambda package. Keep this list lean.
dependencies = [
    "aws-lambda-powertools[tracer]>=3.36.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "boto3>=1.43.114",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "opentelemetry-api>=1.45.1",
]

[project.scripts]
fleetintel-cost = "fleetintel.cost.cli:main"
fleetintel-local = "fleetintel.local.runner:main"
fleetintel-eval = "fleetintel.evals.harness:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "moto[dynamodb,sqs]>=5.2.4",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "boto3-stubs[dynamodb,sqs]>=1.43.114",
    "types-pyyaml>=6.0.12.20260906",
    "pip-audit>=2.10.1",
]
# Only needed by the local runner (docker compose / make demo), never by Lambda.
local = [
    "confluent-kafka>=2.16.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[tool.uv]
default-groups = ["dev", "local"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetintel"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PT", "RET", "PL", "TRY", "PERF", "DTZ"]
ignore = [
    "PLR0913", # wide constructors are expected for DI wiring
    "PLR2004", # thresholds are documented in config / ADRs
    "TRY003",
    "E501",    # the formatter owns line length
    "PLR0917",
    "PLC0415", # deliberate lazy imports keep optional adapters off the Lambda cold-start path
    "PLR0911",
    "PLR0912",
    "PERF401", # explicit loops read better for small report builders
]

[tool.ruff.lint.per-file-ignores]
"src/fleetintel/cost/model.py" = ["B008", "PLR0915"]  # Decimal defaults in pydantic fields; one linear formula per line item
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415", "S311", "DTZ001", "PT018", "E402"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["fleetintel"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:Couldn.t determine the remaining time left:UserWarning"]
markers = ["integration: needs external services (Kafka) - enabled via KAFKA_BOOTSTRAP"]

[tool.coverage.run]
source = ["fleetintel"]
branch = true
omit = ["src/fleetintel/local/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
