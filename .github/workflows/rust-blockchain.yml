name: rust-blockchain

on:
  push:
    branches: [master]
    paths:
      - "rust-blockchain/**"
      - ".github/workflows/rust-blockchain.yml"
  pull_request:
    paths:
      - "rust-blockchain/**"
      - ".github/workflows/rust-blockchain.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust-blockchain

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-blockchain
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-blockchain
      - name: Build
        run: cargo build --all-targets --locked
      - name: Tests (unit, integration and doc tests)
        run: cargo test --all-features --locked
      - name: Benchmarks compile
        run: cargo bench --no-run --locked

  supply-chain:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust-blockchain/Cargo.toml
          command: check advisories licenses bans sources

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: rust-blockchain
          push: false
          load: true
          tags: rust-blockchain:ci
          cache-from: type=gha,scope=rust-blockchain
          cache-to: type=gha,mode=max,scope=rust-blockchain
      - name: Smoke test the node API
        run: |
          docker run -d --name node -p 8080:8080 rust-blockchain:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs node
          exit 1
