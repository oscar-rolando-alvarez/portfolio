name: crypto-trading-java

on:
  push:
    branches: [master]
    paths:
      - "crypto-trading-java/**"
      - ".github/workflows/crypto-trading-java.yml"
  pull_request:
    paths:
      - "crypto-trading-java/**"
      - ".github/workflows/crypto-trading-java.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: crypto-trading-java

jobs:
  build:
    name: Format, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: crypto-trading-java/pom.xml

      - name: Check formatting (Spotless)
        run: ./mvnw -B -ntp spotless:check

      - name: Build, unit tests and Testcontainers integration tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crypto-trading-java-test-reports
          path: |
            crypto-trading-java/target/surefire-reports
            crypto-trading-java/target/failsafe-reports
          retention-days: 7

  docker:
    name: Container image and vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: crypto-trading-java
          load: true
          push: false
          tags: crypto-trading-platform:ci
          cache-from: type=gha,scope=crypto-trading-java
          cache-to: type=gha,mode=max,scope=crypto-trading-java

      # Advisory: reports HIGH/CRITICAL CVEs in the image without failing the build.
      - name: Trivy image scan (advisory)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 --no-progress crypto-trading-platform:ci
