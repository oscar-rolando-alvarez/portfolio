name: react-analytics-dashboard

on:
  push:
    branches: [master]
    paths:
      - 'react-analytics-dashboard/**'
      - '.github/workflows/react-analytics-dashboard.yml'
  pull_request:
    paths:
      - 'react-analytics-dashboard/**'
      - '.github/workflows/react-analytics-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: react-analytics-dashboard

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-analytics-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisory only: dev-tooling advisories (e.g. transitive ESLint deps) are reported, not blocking.
      - name: Audit all dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: react-analytics-dashboard
          push: false
          load: true
          tags: analytics-dashboard:ci
          cache-from: type=gha,scope=react-analytics-dashboard
          cache-to: type=gha,mode=max,scope=react-analytics-dashboard

      - name: Smoke test container health
        run: |
          docker run -d --name dashboard -p 3000:3000 analytics-dashboard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs dashboard
          exit 1
