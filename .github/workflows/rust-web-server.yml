name: rust-web-server

on:
  push:
    branches: [master]
    paths:
      - "rust-web-server/**"
      - ".github/workflows/rust-web-server.yml"
  pull_request:
    paths:
      - "rust-web-server/**"
      - ".github/workflows/rust-web-server.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust-web-server

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-web-server
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: clippy (no default features)
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings

  test:
    name: Tests (with Postgres and Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: rust_web_server
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rust_web_server"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_DATABASE__URL: postgres://postgres:postgres@localhost:5432/rust_web_server
      APP_REDIS__URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-web-server
      - name: Build
        run: cargo build --all-targets --locked
      - name: Unit and integration tests (including service-backed tests)
        run: cargo test --locked -- --include-ignored
      - name: Benchmarks compile
        run: cargo bench --no-run --locked

  supply-chain:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust-web-server/Cargo.toml
          command: check advisories licenses bans sources

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: rust-web-server
          push: false
          load: true
          tags: rust-web-server:ci
          cache-from: type=gha,scope=rust-web-server
          cache-to: type=gha,mode=max,scope=rust-web-server
      - name: Smoke test the container against Postgres and Redis
        run: |
          docker network create rws
          docker run -d --name pg --network rws -e POSTGRES_DB=rust_web_server \
            -e POSTGRES_PASSWORD=postgres postgres:18.6-alpine
          docker run -d --name redis --network rws redis:8-alpine
          until docker exec pg pg_isready -U postgres -d rust_web_server; do sleep 1; done
          docker run -d --name app --network rws -p 8080:8080 \
            -e APP_DATABASE__URL=postgres://postgres:postgres@pg:5432/rust_web_server \
            -e APP_REDIS__URL=redis://redis:6379 rust-web-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health/ready; then
              docker exec app rust-web-server healthcheck && exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
