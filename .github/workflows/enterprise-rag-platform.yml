name: enterprise-rag-platform

on:
  pull_request:
    paths:
      - "enterprise-rag-platform/**"
      - ".github/workflows/enterprise-rag-platform.yml"
  push:
    branches: [master]
    paths:
      - "enterprise-rag-platform/**"
      - ".github/workflows/enterprise-rag-platform.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: enterprise-rag-platform

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: enterprise-rag-platform/uv.lock
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check src tests migrations
      - name: Ruff format
        run: uv run ruff format --check src tests migrations
      - name: Mypy (strict)
        run: uv run mypy

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: enterprise-rag-platform/uv.lock
      - run: uv sync --locked
      - name: Pytest (unit, API, offline eval gate)
        run: uv run pytest tests/unit --cov --cov-report=term --cov-fail-under=80

  integration:
    name: Integration tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RAG_DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: enterprise-rag-platform/uv.lock
      - run: uv sync --locked
      - name: Apply migrations
        run: uv run ragplatform migrate
      - name: Pytest (integration)
        run: uv run pytest tests/integration -m integration

  evals:
    name: RAG eval gate (golden set on pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RAG_DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
      RAG_INGESTION_MODE: queue
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: enterprise-rag-platform/uv.lock
      - run: uv sync --locked
      - run: uv run ragplatform migrate
      - name: Run golden-set evaluation with thresholds
        run: uv run ragplatform evaluate --report eval-report.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: enterprise-rag-platform/eval-report.json
          if-no-files-found: ignore

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: enterprise-rag-platform/uv.lock
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
      - name: pip-audit
        run: uv run --only-dev pip-audit -r requirements.txt --disable-pip --require-hashes --progress-spinner off

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: enterprise-rag-platform
          push: false
          load: true
          tags: enterprise-rag-platform:ci
          cache-from: type=gha,scope=enterprise-rag-platform
          cache-to: type=gha,mode=max,scope=enterprise-rag-platform
      - name: Smoke test container (non-root, offline demo)
        run: |
          test "$(docker run --rm --entrypoint id enterprise-rag-platform:ci -u)" = "10001"
          docker run --rm enterprise-rag-platform:ci ask "How many weeks of paid parental leave are offered?" | grep -q "16 weeks"

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: enterprise-rag-platform/infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend, no credentials)
        working-directory: enterprise-rag-platform/infra/terraform/envs/reference
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: enterprise-rag-platform/infra/terraform/envs/reference
        run: terraform validate
