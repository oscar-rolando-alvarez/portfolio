name: react-collaboration-app

on:
  push:
    branches: [master]
    paths:
      - 'react-collaboration-app/**'
      - '.github/workflows/react-collaboration-app.yml'
  pull_request:
    paths:
      - 'react-collaboration-app/**'
      - '.github/workflows/react-collaboration-app.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: react-collaboration-app

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-collaboration-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Audit server runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisory only: bundled frontend/dev-tooling advisories are reported, not blocking.
      - name: Audit all dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: react-collaboration-app
          push: false
          load: true
          tags: collaboration-canvas:ci
          cache-from: type=gha,scope=react-collaboration-app
          cache-to: type=gha,mode=max,scope=react-collaboration-app

      - name: Smoke test container health
        run: |
          docker run -d --name canvas -p 3001:3001 collaboration-canvas:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            sleep 2
          done
          docker logs canvas
          exit 1
