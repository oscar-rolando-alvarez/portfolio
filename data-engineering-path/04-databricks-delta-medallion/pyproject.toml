[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["logs", "data", "lake"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "AIR"]

[tool.ruff.lint.isort]
known-first-party = ["lib", "include", "databricks_local", "jobs", "tests_airflow", "tests_spark"]
