name: shop
version: "1.0.0"
config-version: 2
profile: shop

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, logs]

vars:
  # Incremental models reprocess this many days of load batches to absorb late fixes.
  lookback_days: 3

models:
  shop:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
