version: 2

models:
  - name: fct_orders
    description: One row per order with its settled payment amount.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
  - name: mart_daily_revenue
    description: Daily paid revenue by customer country. Published as an Airflow Asset.
    columns:
      - name: order_date
        data_tests: [not_null]
