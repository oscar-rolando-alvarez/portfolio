version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [paid, pending, cancelled]
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: [card, pse, wallet]
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
