# Application tier. Images are built from the shared Dockerfile (see README).
# Secrets come from the 'ecommerce-secrets' Secret; create it out-of-band (see secrets.example.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: ecommerce
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: identity
        image: ghcr.io/oscar-rolando-alvarez/ecommerce-identity:latest
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: OTEL_SERVICE_NAME
          value: identity
        - name: Jwt__SigningKey
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: jwt-signing-key
        - name: ConnectionStrings__identitydb
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: identitydb
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        startupProbe:
          httpGet:
            path: /alive
            port: http
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /alive
            port: http
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity
  ports:
  - name: http
    port: 80
    targetPort: http
---
