# Template only - copy, fill in, and apply out-of-band (or use External Secrets / Sealed Secrets).
# Do not commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  jwt-signing-key: "<openssl rand -base64 48>"
  postgres-password: "<postgres password>"
  rabbitmq-user: "ecommerce"
  rabbitmq-password: "<rabbitmq password>"
  identitydb: "Host=postgres;Database=identitydb;Username=postgres;Password=<postgres password>"
  orderingdb: "Host=postgres;Database=orderingdb;Username=postgres;Password=<postgres password>"
  paymentdb: "Host=postgres;Database=paymentdb;Username=postgres;Password=<postgres password>"
  messaging: "amqp://ecommerce:<rabbitmq password>@rabbitmq:5672"
