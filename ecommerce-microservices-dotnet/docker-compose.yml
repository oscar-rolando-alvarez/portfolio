# Full stack without Aspire: docker compose --env-file .env up --build
# Gateway: http://localhost:8080  ·  Telemetry dashboard: http://localhost:18888

name: ecommerce

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

x-build: &build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

  identity:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Identity/ECommerce.Services.Identity/ECommerce.Services.Identity.csproj
        ASSEMBLY: ECommerce.Services.Identity
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: identity
      ConnectionStrings__identitydb: Host=postgres;Database=identitydb;Username=postgres;Password=${POSTGRES_PASSWORD}
      Identity__Admin__Email: ${ADMIN_EMAIL:-}
      Identity__Admin__Password: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }

  catalog:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Catalog/ECommerce.Services.Catalog/ECommerce.Services.Catalog.csproj
        ASSEMBLY: ECommerce.Services.Catalog
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: catalog
      ConnectionStrings__catalogdb: mongodb://mongo:27017/catalogdb
    depends_on:
      mongo: { condition: service_healthy }

  basket:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Basket/ECommerce.Services.Basket/ECommerce.Services.Basket.csproj
        ASSEMBLY: ECommerce.Services.Basket
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: basket
      ConnectionStrings__redis: redis:6379
      services__catalog__http__0: http://catalog:8080
    depends_on:
      redis: { condition: service_healthy }
      catalog: { condition: service_healthy }

  ordering:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Ordering/ECommerce.Services.Ordering/ECommerce.Services.Ordering.csproj
        ASSEMBLY: ECommerce.Services.Ordering
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: ordering
      ConnectionStrings__orderingdb: Host=postgres;Database=orderingdb;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__messaging: amqp://${RABBITMQ_USER:-ecommerce}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      services__catalog__http__0: http://catalog:8080
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      catalog: { condition: service_healthy }

  payment:
    build:
      <<: *build
      args:
        PROJECT: src/Services/Payment/ECommerce.Services.Payment/ECommerce.Services.Payment.csproj
        ASSEMBLY: ECommerce.Services.Payment
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: payment
      ConnectionStrings__paymentdb: Host=postgres;Database=paymentdb;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__messaging: amqp://${RABBITMQ_USER:-ecommerce}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      PaymentGateway__ApprovalLimit: ${PAYMENT_APPROVAL_LIMIT:-10000}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  gateway:
    build:
      <<: *build
      args:
        PROJECT: src/ApiGateway/ECommerce.ApiGateway/ECommerce.ApiGateway.csproj
        ASSEMBLY: ECommerce.ApiGateway
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: gateway
      services__identity__http__0: http://identity:8080
      services__catalog__http__0: http://catalog:8080
      services__basket__http__0: http://basket:8080
      services__ordering__http__0: http://ordering:8080
      services__payment__http__0: http://payment:8080
    ports:
      - "8080:8080"
    depends_on:
      identity: { condition: service_healthy }
      catalog: { condition: service_healthy }
      basket: { condition: service_healthy }
      ordering: { condition: service_healthy }
      payment: { condition: service_healthy }

volumes:
  postgres-data:
  mongo-data:
