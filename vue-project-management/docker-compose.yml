services:
  app:
    build: .
    image: vue-project-management:local
    ports:
      - "3000:3000"
    environment:
      # Required in production. Generate one with: openssl rand -base64 48
      NUXT_JWT_SECRET: ${NUXT_JWT_SECRET:?Set NUXT_JWT_SECRET (see .env.example)}
      # Allow the session cookie over plain HTTP when not served from localhost.
      NUXT_COOKIE_SECURE: ${NUXT_COOKIE_SECURE:-true}
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
