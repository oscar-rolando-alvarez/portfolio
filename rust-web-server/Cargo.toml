[package]
name = "rust-web-server"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Oscar Alvarez <oralvarez@gmail.com>"]
description = "Production-grade async web server built with Rust and Actix Web"
license = "MIT"
repository = "https://github.com/oscar-rolando-alvarez/portfolio"
publish = false

[lib]
name = "rust_web_server"
path = "src/lib.rs"

[[bin]]
name = "rust-web-server"
path = "src/main.rs"

[features]
default = ["otel"]
# Export traces over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT is set.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
# Web framework
# HTTP/2 is terminated by the ingress/load balancer; disabling it here drops the
# unmaintained h2 0.3 line pulled in by actix-http.
actix-web = { version = "4.17", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "unicode"] }
actix-cors = "0.7"
actix-files = "0.7"
actix-multipart = "0.8"
actix-web-httpauth = "0.8"
actix-ws = "0.4"

# Async runtime
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Persistence
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
    "macros",
    "derive",
] }
redis = { version = "1.7", default-features = false, features = ["aio", "tokio-comp", "connection-manager"] }

# Security
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6"
sha2 = "0.11"
uuid = { version = "1.28", features = ["v4", "serde"] }

# Rate limiting
governor = "0.10"
dashmap = "6.2"

# Observability
prometheus = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-opentelemetry = { version = "0.34", optional = true }

# Configuration
config = { version = "0.15", default-features = false, features = ["toml"] }
dotenvy = "0.15"

# Validation, time, errors
validator = { version = "0.21", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
num_cpus = "1.17"

[dev-dependencies]
actix-http = "3"
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "server_benchmark"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
