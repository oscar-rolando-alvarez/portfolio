# Local stack: API + PostgreSQL + Redis.
# Usage: cp .env.example .env && docker compose up --build
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_DATABASE__URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rust_web_server
      APP_REDIS__URL: redis://redis:6379
      APP_JWT__SECRET: ${APP_JWT__SECRET:-local-development-secret-at-least-32-chars}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_LOGGING__FORMAT: ${APP_LOGGING__FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: rust_web_server
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rust_web_server"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads:
