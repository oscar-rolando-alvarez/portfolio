# Local stack: docker compose --env-file .env up --build -d --wait
# API: http://localhost:8080  ·  Telemetry dashboard: http://localhost:18888

name: document-management

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: documentsdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentsdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__documentsdb: Host=postgres;Database=documentsdb;Username=postgres;Password=${POSTGRES_PASSWORD}
      # Demo token validation with a shared key (see scripts/dev-token.sh). Use Authority/Audience for a real IdP.
      Authentication__Schemes__Bearer__ValidIssuer: document-management-dev
      Authentication__Schemes__Bearer__ValidAudiences__0: document-management-api
      Authentication__Schemes__Bearer__SigningKeys__0__Issuer: document-management-dev
      Authentication__Schemes__Bearer__SigningKeys__0__Value: ${JWT_SIGNING_KEY_BASE64:?set JWT_SIGNING_KEY_BASE64 in .env}
      Storage__Provider: FileSystem
      AI__Enabled: ${AI_ENABLED:-false}
      AI__Endpoint: ${AI_ENDPOINT:-http://host.docker.internal:11434/v1}
      AI__Model: ${AI_MODEL:-llama3.2}
      AI__ApiKey: ${AI_API_KEY:-}
      OTEL_SERVICE_NAME: document-management-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - document-storage:/data/storage
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  document-storage:
