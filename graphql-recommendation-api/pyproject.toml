[project]
name = "graphql-recommendation-api"
version = "2.0.0"
description = "GraphQL recommendation API: hybrid collaborative/content/semantic recommendations with provider-agnostic embeddings"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Oscar Alvarez", email = "oralvarez@gmail.com" }]
keywords = ["graphql", "strawberry", "recommendations", "embeddings", "semantic-search", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "strawberry-graphql>=0.336.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.32.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "redis>=8.1.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "openai>=3.33.0",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
# Qdrant vector store adapter (the default store is in-process NumPy).
qdrant = ["qdrant-client>=1.19.1"]
# Optional OpenTelemetry tracing (enabled when OTEL_EXPORTER_OTLP_ENDPOINT is set).
otel = [
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "scipy-stubs",
    # Exercised in tests via its embedded in-memory mode (no server needed).
    "qdrant-client>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommender"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PT"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"alembic/versions/**" = ["E501"]
"src/recommender/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["recommender"]
mypy_path = "src"
plugins = ["pydantic.mypy", "strawberry.ext.mypy_plugin"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Strawberry's field/mutation decorators are not fully typed.
module = ["recommender.graphql.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "qdrant_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers --strict-config --cov=recommender --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["recommender"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "\\.\\.\\.$",
]
