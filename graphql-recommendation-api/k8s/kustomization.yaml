apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Application manifests only. PostgreSQL, Redis and Qdrant are expected as managed services
# (or separate Helm releases); point DATABASE_URL / REDIS_URL / QDRANT_URL at them.
# The `api-secrets` Secret must exist beforehand (see api/secret.example.yaml).
namespace: recommendation-system

resources:
  - namespace.yaml
  - api/configmap.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - ingress/ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: graphql-recommendation-api
      app.kubernetes.io/part-of: recommendation-system
    includeSelectors: true

images:
  - name: graphql-recommendation-api
    newName: ghcr.io/oscar-rolando-alvarez/graphql-recommendation-api
    newTag: "2.0.0"
