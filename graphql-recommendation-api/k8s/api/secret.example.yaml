# Example only - do not commit real values. Create the real secret out of band, e.g.:
#   kubectl -n recommendation-system create secret generic api-secrets \
#     --from-literal=DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/recommender \
#     --from-literal=REDIS_URL=redis://redis:6379/0 \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=LLM_BASE_URL=https://your-openai-compatible-endpoint/v1 \
#     --from-literal=LLM_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/recommender"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET_KEY: "replace-me"
  LLM_BASE_URL: ""
  LLM_API_KEY: ""
