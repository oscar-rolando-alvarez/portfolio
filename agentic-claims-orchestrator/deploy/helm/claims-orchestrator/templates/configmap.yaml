apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claims.fullname" . }}
  labels:
    {{- include "claims.labels" . | nindent 4 }}
data:
  PORT: "8080"
  RUN_MIGRATIONS: "false"
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claims.fullname" . }}-policy
  labels:
    {{- include "claims.labels" . | nindent 4 }}
data:
  claims-policy.json: |-
{{ .Files.Get "files/claims-policy.json" | indent 4 }}
