server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/plain,text/css,application/javascript,application/json

spring:
  application:
    name: enterprise-messaging-system

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/messaging_db}
    username: ${DATABASE_USERNAME:messaging_user}
    password: ${DATABASE_PASSWORD:messaging_pass}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:messaging-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # Producer type headers select MessageEvent vs UserEvent; the default type is a fallback.
        spring.json.trusted.packages: com.enterprise.messaging.event
        spring.json.value.default.type: com.enterprise.messaging.event.MessageEvent
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      observation-enabled: true
    template:
      observation-enabled: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  # OTLP trace export is enabled by setting MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  # (e.g. http://otel-collector:4318/v1/traces); without it no exporter is created.

logging:
  level:
    com.enterprise.messaging: ${LOG_LEVEL:INFO}
  # JSON logs: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash / gelf).

messaging:
  jwt:
    # Base64-encoded or raw secret of at least 256 bits. Always override via JWT_SECRET outside local dev.
    secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtMzItYnl0ZXMtbWluaW11bQ==}
    expiration: ${JWT_EXPIRATION:86400000}

  encryption:
    # AES-256-GCM for message content at rest. Key: openssl rand -base64 32
    enabled: ${ENCRYPTION_ENABLED:false}
    key: ${ENCRYPTION_KEY:}

  file-upload:
    max-size: ${FILE_UPLOAD_MAX_SIZE:50MB}
    allowed-types: image/jpeg,image/png,image/gif,video/mp4,audio/mpeg,application/pdf
    storage-path: ${FILE_STORAGE_PATH:/tmp/messaging-uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
