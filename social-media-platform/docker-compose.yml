services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: socialconnect
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-social}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d socialconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    image: social-media-platform-migrate:local
    environment:
      DATABASE_URL: postgresql://social:${POSTGRES_PASSWORD:-social}@db:5432/socialconnect
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    image: social-media-platform:local
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://social:${POSTGRES_PASSWORD:-social}@db:5432/socialconnect
      # Required. Generate with: openssl rand -base64 48
      NUXT_JWT_SECRET: ${NUXT_JWT_SECRET:?Set NUXT_JWT_SECRET (see .env.example)}
      NUXT_COOKIE_SECURE: ${NUXT_COOKIE_SECURE:-true}
      NUXT_MODERATION_PROVIDER: ${NUXT_MODERATION_PROVIDER:-keyword}
      NUXT_MODERATION_BASE_URL: ${NUXT_MODERATION_BASE_URL:-}
      NUXT_MODERATION_API_KEY: ${NUXT_MODERATION_API_KEY:-}
      NUXT_MODERATION_MODEL: ${NUXT_MODERATION_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
