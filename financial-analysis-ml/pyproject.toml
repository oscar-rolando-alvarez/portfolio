[project]
name = "financial-analysis-ml"
version = "2.0.0"
description = "Portfolio analytics API with clean architecture, quantitative risk metrics and optional LLM-generated narrative reports"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Oscar Alvarez", email = "oralvarez@gmail.com" }]
keywords = ["finance", "portfolio", "risk", "fastapi", "genai", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.32.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "openai>=3.33.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
# Deep-learning price forecasting (LSTM). Heavy; not installed in CI.
ml = ["tensorflow>=2.21.0", "scikit-learn>=1.9.1"]
# Optional OpenTelemetry tracing (enabled when OTEL_EXPORTER_OTLP_ENDPOINT is set).
otel = [
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_analysis"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "C4", "PT"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "E501"]
"src/financial_analysis/infrastructure/ml/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["financial_analysis"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["financial_analysis.analysis.*", "financial_analysis.genai.*", "financial_analysis.config"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Optional deep-learning module (requires the `ml` extra, not installed in CI).
module = ["financial_analysis.infrastructure.ml.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tensorflow.*", "sklearn.*", "joblib.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers --strict-config --cov=financial_analysis --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: API-level tests using an in-memory database"]

[tool.coverage.run]
source = ["financial_analysis"]
branch = true
omit = ["*/infrastructure/ml/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
]
