version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
    gocritic:
      disabled-checks:
        - ifElseChain
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, contextcheck, revive, usestdlibvars]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/oscar-rolando-alvarez/portfolio/llm-gateway
