# Eval configuration against a REAL OpenAI-compatible endpoint.
#
# Suites that depend on gateway logic only (pii, injection, governance) are
# provider-independent; the cache suite measures how your embedding model
# separates paraphrases from different questions, which is how the
# semantic_threshold should be calibrated. Routing/fallback suites rely on
# mock failure injection and are not meaningful here.
#
#   export LLM_BASE_URL=https://api.openai.com/v1 LLM_API_KEY=... \
#          LLM_CHAT_MODEL=gpt-4o-mini LLM_EMBED_MODEL=text-embedding-3-small
#   go run ./cmd/evals -config evals/config.real.yaml -suites pii,injection,cache
#
# Note: the pii suite checks the upstream echo; real models do not echo
# verbatim, so with a real model use it as a smoke test, not a metric.

embeddings:
  alias: embed

providers:
  - name: upstream
    type: openai
    base_url: ${LLM_BASE_URL:-https://api.openai.com/v1}
    api_key: ${LLM_API_KEY:-}
    api_key_header: ${LLM_API_KEY_HEADER:-Authorization}

models:
  - alias: chat-priority
    targets: [{ provider: upstream, model: "${LLM_CHAT_MODEL:-gpt-4o-mini}" }]
  - alias: embed
    kind: embedding
    targets: [{ provider: upstream, model: "${LLM_EMBED_MODEL:-text-embedding-3-small}" }]

tenant_defaults:
  rate_limit: { requests_per_minute: 1000, tokens_per_minute: 10000000 }
  budget: { monthly_usd: 5, mode: hard }
  cache: { enabled: false }

tenants:
  - id: guarded
    guardrails: { pii: redact, injection: block, injection_threshold: 0.7 }
  - id: cached
    guardrails: { pii: redact, injection: off }
    cache: { enabled: true, semantic: true, semantic_threshold: ${EVAL_SEMANTIC_THRESHOLD:-0.95}, ttl: 10m }
  - id: limited
    rate_limit: { requests_per_minute: 3 }
    guardrails: { injection: off }
  - id: budgeted
    budget: { monthly_tokens: 60, mode: hard }
    guardrails: { injection: off }
