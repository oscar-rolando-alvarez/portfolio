[workspace]
members = ["programs/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/oscar-rolando-alvarez/portfolio"

[workspace.dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["derive", "solana-v3"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token", "solana-v3"] }
pyth-solana-receiver-sdk = "2.0.0"
litesvm = "0.18.0"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-account = "4"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
result_large_err = "allow"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
