# Runs the dashboard container. NEXT_PUBLIC_* values are inlined by Next.js at
# build time, so they are passed as build args (override via a .env file next
# to this compose file or your shell environment).
services:
  app:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_CLUSTER: ${NEXT_PUBLIC_CLUSTER:-devnet}
        NEXT_PUBLIC_LENDING_PROGRAM_ID: ${NEXT_PUBLIC_LENDING_PROGRAM_ID:-4sohRUrhAnm75sFwUbeE6tJHRQCNq5MMf4PEYEUi1WdD}
        NEXT_PUBLIC_GOVERNANCE_PROGRAM_ID: ${NEXT_PUBLIC_GOVERNANCE_PROGRAM_ID:-JCFC4bviKZmiVdsDkvzXjRCzE9Yc7P1VumkgkiBvQ43c}
    image: defi-lending-app:local
    ports:
      - "3000:3000"
    restart: unless-stopped
