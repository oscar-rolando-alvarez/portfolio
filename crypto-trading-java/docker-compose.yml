name: crypto-trading

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-crypto_trading}
      POSTGRES_USER: ${DB_USERNAME:-crypto_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crypto_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-crypto_trading}
      DB_USERNAME: ${DB_USERNAME:-crypto_user}
      DB_PASSWORD: ${DB_PASSWORD:-crypto_password}

  # Optional local tracing backend: `docker compose --profile observability up`
  # then set MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  postgres_data:
