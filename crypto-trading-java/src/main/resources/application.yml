server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: crypto-trading-platform

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crypto_trading}
    username: ${DB_USERNAME:crypto_user}
    password: ${DB_PASSWORD:crypto_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  security:
    jwt:
      # Base64-encoded or raw secret of at least 256 bits. Always override via JWT_SECRET outside local dev.
      secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtMzItYnl0ZXMtbWluaW11bQ==}
      expiration: ${JWT_EXPIRATION:86400000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

trading:
  engine:
    risk:
      max-position-size: ${RISK_MAX_POSITION_SIZE:1000000}
      max-daily-loss: ${RISK_MAX_DAILY_LOSS:100000}
      max-drawdown: ${RISK_MAX_DRAWDOWN:0.2}
      margin-requirement: ${RISK_MARGIN_REQUIREMENT:0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  # OTLP trace export is enabled by setting MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  # (e.g. http://otel-collector:4318/v1/traces); without it no exporter is created.

logging:
  level:
    com.cryptotrading: ${LOG_LEVEL:INFO}
  # JSON logs: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash / gelf).

springdoc:
  swagger-ui:
    path: /swagger-ui.html
