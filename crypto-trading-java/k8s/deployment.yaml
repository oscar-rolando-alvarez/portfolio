# Reference manifests. The matching engine keeps order books in memory, so the Deployment runs a
# single replica with a Recreate strategy; scaling out requires partitioning symbols across instances.
#
# Create the secret out of band (never commit real values), e.g.:
#   kubectl create secret generic crypto-trading-secrets \
#     --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=... --from-literal=JWT_SECRET=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-trading-app
  labels:
    app.kubernetes.io/name: crypto-trading-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crypto-trading-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crypto-trading-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/oscar-rolando-alvarez/crypto-trading-platform:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: crypto-trading-config
            - secretRef:
                name: crypto-trading-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crypto-trading-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crypto-trading-app
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crypto-trading-config
data:
  DB_URL: "jdbc:postgresql://postgres:5432/crypto_trading"
  LOG_LEVEL: "INFO"
  TRACING_SAMPLING_PROBABILITY: "0.1"
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
