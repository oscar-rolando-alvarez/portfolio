[package]
name = "rust-blockchain"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Oscar Alvarez <oralvarez@gmail.com>"]
description = "A functional blockchain implementation in Rust"
license = "MIT"
repository = "https://github.com/oscar-rolando-alvarez/portfolio"
readme = "README.md"
keywords = ["blockchain", "proof-of-work", "utxo", "libp2p", "wasm"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1", default-features = false, features = ["alloc", "use-std"] }

# Cryptography
sha2 = "0.11"
ripemd = "0.2"
secp256k1 = { version = "0.33", features = ["rand", "recovery", "global-context"] }
hex = "0.4"
bs58 = "0.5"
rand = "0.9"

# Networking
libp2p = { version = "0.57", features = [
    "tokio",
    "tcp",
    "dns",
    "noise",
    "yamux",
    "gossipsub",
    "mdns",
    "identify",
    "ping",
    "kad",
    "request-response",
    "cbor",
    "macros",
] }
tokio = { version = "1.53", features = ["full"] }
futures = "0.3"

# Web framework
# HTTP/2 is left to a reverse proxy; this also drops the unmaintained h2 0.3 line.
actix-web = { version = "4.17", default-features = false, features = ["macros", "compress-gzip", "unicode"] }
actix-cors = "0.7"

# CLI
clap = { version = "4.6", features = ["derive"] }
colored = "3"

# Persistence
redb = "4"

# Utilities
uuid = { version = "1.28", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
num_cpus = "1.17"

# BIP39 mnemonic phrases
bip39 = "3.0.0"

# Smart contract VM
wasmtime = { version = "49", default-features = false, features = [
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
    "wat",
] }
wat = "1.262"

[dev-dependencies]
criterion = "0.8"
tempfile = "3.27"

[lib]
name = "rust_blockchain"
path = "src/lib.rs"

[[bin]]
name = "blockchain-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "blockchain-node"
path = "src/bin/node.rs"

[[bin]]
name = "blockchain-miner"
path = "src/bin/miner.rs"

[[bench]]
name = "blockchain_bench"
harness = false

# Thin LTO keeps most of the speed-up while staying within the memory of CI
# runners and Docker builders (fat LTO across wasmtime + libp2p does not).
[profile.release]
lto = "thin"
strip = true
