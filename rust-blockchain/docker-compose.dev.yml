# Development container with automatic rebuild on source changes.
#   docker compose -f docker-compose.dev.yml up --build
services:
  blockchain-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"   # HTTP API
      - "8333:8333"   # libp2p
    volumes:
      - .:/app
      - dev_target:/app/target
      - dev_data:/data
    environment:
      RUST_LOG: debug
      RUST_BACKTRACE: "1"
    working_dir: /app

volumes:
  dev_target:
  dev_data:
