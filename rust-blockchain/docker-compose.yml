# Local network: one node by default, two extra peers with `--profile multi-node`,
# a standalone miner with `--profile mining`.
#
#   docker compose up --build
#   docker compose --profile multi-node up --build

x-node: &node
  build: .
  image: rust-blockchain:local
  environment:
    RUST_LOG: ${RUST_LOG:-info}
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "blockchain-cli", "health", "--addr", "127.0.0.1:8080"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  blockchain-node:
    <<: *node
    ports:
      - "8080:8080"   # HTTP API
      - "8333:8333"   # libp2p
    volumes:
      - node_data:/data
    command: >
      blockchain-node --data-dir /data --api-host 0.0.0.0 --api-port 8080
      --p2p-port 8333 --network testnet --no-mdns

  blockchain-peer1:
    <<: *node
    profiles: [multi-node]
    ports:
      - "8081:8080"
    volumes:
      - peer1_data:/data
    command: >
      blockchain-node --data-dir /data --api-host 0.0.0.0 --api-port 8080
      --p2p-port 8333 --network testnet --no-mdns
      --bootstrap /dns4/blockchain-node/tcp/8333
    depends_on:
      blockchain-node:
        condition: service_healthy

  blockchain-peer2:
    <<: *node
    profiles: [multi-node]
    ports:
      - "8082:8080"
    volumes:
      - peer2_data:/data
    command: >
      blockchain-node --data-dir /data --api-host 0.0.0.0 --api-port 8080
      --p2p-port 8333 --network testnet --no-mdns
      --bootstrap /dns4/blockchain-node/tcp/8333
    depends_on:
      blockchain-node:
        condition: service_healthy

  blockchain-miner:
    image: rust-blockchain:local
    build: .
    profiles: [mining]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - miner_data:/data
    command: >
      blockchain-miner --data-dir /data
      --address ${MINER_ADDRESS:-replace-with-your-wallet-address}
      --threads 2 --stats-interval 60
    restart: unless-stopped

volumes:
  node_data:
  peer1_data:
  peer2_data:
  miner_data:
